name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # The dist script passes --publish never: publishing is handled by the
      # release/artifact steps below, and electron-builder otherwise attempts
      # an implicit publish in CI and fails without a GitHub token.
      - run: npm run dist
      - name: Upload installer to the release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe
      - name: Save installer as a build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v6
        with:
          name: desktop-buddy-windows-installer
          path: release/*.exe
